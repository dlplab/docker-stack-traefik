---
services:
  traefik:
    image: traefik:v3.5
    environment:
      TRAEFIK_GLOBAL_CHECKNEWVERSION: false
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: false
      TRAEFIK_LOG_LEVEL: DEBUG
      TRAEFIK_API: true
      TRAEFIK_API_INSECURE: true
      TRAEFIK_API_DASHBOARD: true

      TRAEFIK_ENTRYPOINTS_WEB: true
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE: true
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"

      TRAEFIK_PROVIDERS_DOCKER: true
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: "unix:///var/run/docker.sock"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false

      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_CASERVER: "https://acme-v02.api.letsencrypt.org/directory"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE_PROVIDER: "route53"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE_RESOLVERS: ${AWS_CHALLENGE_RESOLVERS}
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_KEYTYPE: EC256
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_STORAGE: /var/traefik/certs/route53-acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_EMAIL: ${EMAIL}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID}
      AWS_REGION: ${AWS_REGION}
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-certs:/var/traefik/certs/:rw
    networks:
      - frontend
    restart: unless-stopped
networks:
  frontend:
    external: true
volumes:
  traefik-certs:
    external: true