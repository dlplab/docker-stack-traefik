---
services:
  traefik:
    image: traefik:latest
    environment:
      TRAEFIK_GLOBAL_CHECKNEWVERSION: false
      TRAEFIK_GLOBAL_SENDANONYMOUSUSAGE: false
      TRAEFIK_LOG_LEVEL: DEBUG
      TRAEFIK_API: true
      TRAEFIK_API_INSECURE: true
      TRAEFIK_API_DASHBOARD: true

      TRAEFIK_ENTRYPOINTS_WEB: true
      TRAEFIK_ENTRYPOINTS_WEB_ADDRESS: ":80"
      TRAEFIK_ENTRYPOINTS_WEBSECURE: true
      TRAEFIK_ENTRYPOINTS_WEBSECURE_ADDRESS: ":443"

      TRAEFIK_PROVIDERS_DOCKER: true
      TRAEFIK_PROVIDERS_DOCKER_ENDPOINT: "unix:///var/run/docker.sock"
      TRAEFIK_PROVIDERS_DOCKER_EXPOSEDBYDEFAULT: false

      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_CASERVER: "https://acme-v02.api.letsencrypt.org/directory"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE_PROVIDER: "route53"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_DNSCHALLENGE_RESOLVERS: ${AWS_CHALLENGE_RESOLVERS}
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_KEYTYPE: EC256
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_STORAGE: /var/traefik/certs/route53-acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53_ACME_EMAIL: ${EMAIL}

      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE: true
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_CASERVER: "https://acme-v02.api.letsencrypt.org/directory"
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_DNSCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_DNSCHALLENGE_PROVIDER: "cloudflare"
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_DNSCHALLENGE_RESOLVERS: ${CF_CHALLENGE_RESOLVERS}
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_KEYTYPE: EC256
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_STORAGE: /var/traefik/certs/cloudflare-acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_CLOUDFLARE_ACME_EMAIL: ${EMAIL}

      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_HOSTED_ZONE_ID: ${AWS_HOSTED_ZONE_ID}
      AWS_REGION: ${AWS_REGION}

      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}

      # ✅ enable file provider (needed for TLS options)
      TRAEFIK_PROVIDERS_FILE_DIRECTORY: /etc/traefik/dynamic
      TRAEFIK_PROVIDERS_FILE_WATCH: "true"

      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_CASERVER: "https://acme-v02.api.letsencrypt.org/directory"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_DNSCHALLENGE: true
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_DNSCHALLENGE_PROVIDER: "route53"
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_DNSCHALLENGE_RESOLVERS: ${AWS_CHALLENGE_RESOLVERS}
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_KEYTYPE: RSA2048
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_STORAGE: /var/traefik/certs/route53rsa-acme.json
      TRAEFIK_CERTIFICATESRESOLVERS_ROUTE53RSA_ACME_EMAIL: ${EMAIL}

    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - traefik-certs:/var/traefik/certs/:rw
      - /data/compose/traefik/dynamic/tls12_support.yaml:/etc/traefik/dynamic/traefik_tls.yaml:ro
    networks:
      - frontend
    restart: unless-stopped
networks:
  frontend:
    external: true
volumes:
  traefik-certs:
    external: true
    